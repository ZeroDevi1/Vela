name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version and check tag
        id: meta
        run: |
          VERSION=$(sed -n 's/.*appVersionName *= *"\([^"]*\)".*/\1/p' build.gradle | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "Could not read appVersionName from build.gradle"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match appVersionName ${VERSION} (expected v${VERSION})"
            exit 1
          fi

      - name: Build user-facing release notes
        id: notes
        run: |
          chmod +x scripts/release-notes.sh
          ./scripts/release-notes.sh --self-test
          ./scripts/release-notes.sh \
            --version "${{ steps.meta.outputs.version }}" \
            --out "$RUNNER_TEMP/release-body.md"
          echo "body_path=$RUNNER_TEMP/release-body.md" >> "$GITHUB_OUTPUT"
          echo "Release title: Vela v${{ steps.meta.outputs.version }}"
          echo "----- release body -----"
          cat "$RUNNER_TEMP/release-body.md"
          echo "------------------------"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 默认会安装已从 SDK 仓库下架的 legacy `tools` 包，导致 sdkmanager 退出 1；
          # 只装 platform-tools，其余 SDK 组件由 Gradle 按 compileSdk 自动下载。
          packages: platform-tools

      - name: Check signing secrets
        env:
          VELA_STORE_FILE_BASE64: ${{ secrets.VELA_STORE_FILE_BASE64 }}
          VELA_STORE_PASSWORD: ${{ secrets.VELA_STORE_PASSWORD }}
          VELA_KEY_PASSWORD: ${{ secrets.VELA_KEY_PASSWORD }}
        run: |
          missing=()
          [ -n "$VELA_STORE_FILE_BASE64" ] || missing+=("VELA_STORE_FILE_BASE64")
          [ -n "$VELA_STORE_PASSWORD" ] || missing+=("VELA_STORE_PASSWORD")
          [ -n "$VELA_KEY_PASSWORD" ] || missing+=("VELA_KEY_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing GitHub secret(s): ${missing[*]}"
            echo "Refusing to publish an unsigned APK."
            exit 1
          fi

      - name: Decode signing keystore
        env:
          VELA_STORE_FILE_BASE64: ${{ secrets.VELA_STORE_FILE_BASE64 }}
        run: echo "$VELA_STORE_FILE_BASE64" | base64 --decode > vela-release.keystore

      - name: Assemble signed release
        env:
          VELA_STORE_FILE: ${{ github.workspace }}/vela-release.keystore
          VELA_STORE_PASSWORD: ${{ secrets.VELA_STORE_PASSWORD }}
          VELA_KEY_ALIAS: vela
          VELA_KEY_PASSWORD: ${{ secrets.VELA_KEY_PASSWORD }}
        run: |
          ./gradlew :phone:assembleRelease --max-workers=2
          ./gradlew :tv:assembleRelease --max-workers=2

      - name: Verify APKs are signed
        run: |
          shopt -s nullglob
          apks=(phone/build/outputs/apk/release/*.apk tv/build/outputs/apk/release/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "No release APKs found"
            exit 1
          fi

          signer=""
          for dir in "${ANDROID_SDK_ROOT:-}"/build-tools/* "${ANDROID_HOME:-}"/build-tools/*; do
            if [ -x "$dir/apksigner" ]; then
              signer="$dir/apksigner"
            fi
          done
          if [ -z "$signer" ]; then
            echo "apksigner not found"
            exit 1
          fi

          for apk in "${apks[@]}"; do
            echo "verifying $apk"
            "$signer" verify --print-certs "$apk"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: vela-release
          path: |
            phone/build/outputs/apk/release/*.apk
            tv/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Vela v${{ steps.meta.outputs.version }}
          body_path: ${{ runner.temp }}/release-body.md
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          files: |
            phone/build/outputs/apk/release/*.apk
            tv/build/outputs/apk/release/*.apk

  # 公开发布只提供未签名 IPA，由用户用自己的证书重签（zsign / Sideloadly / AltStore 等）；
  # 仓库和 CI 都不持有任何 iOS 证书。依赖 android job 先创建 GitHub Release，再追加附件。
  ios:
    needs: android
    # 默认 Xcode 26.6，满足 IPHONEOS_DEPLOYMENT_TARGET = 26.2。
    runs-on: macos-26
    env:
      IPA_NAME: vela-ios-${{ needs.android.outputs.version }}-unsigned.ipa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build unsigned IPA
        run: |
          xcodebuild -version
          ./scripts/install-ios-release.sh --unsigned
          mv build/ios/Vela-unsigned.ipa "build/ios/$IPA_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: vela-ios-unsigned
          path: build/ios/${{ env.IPA_NAME }}

      - name: Attach IPA to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.android.outputs.tag }}" "build/ios/$IPA_NAME" --clobber
