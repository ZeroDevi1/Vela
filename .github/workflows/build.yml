name: Build APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build ${{ matrix.module }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        module: [phone, tv]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew :${{ matrix.module }}:assembleDebug --max-workers=2 --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vela-${{ matrix.module }}-debug-${{ github.sha }}
          path: ${{ matrix.module }}/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
